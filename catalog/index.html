<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let's Hair · 헤어 시뮬레이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><b>LET'S HAIR</b><span>HAIR SIMULATOR</span></div>
  <div class="gender" role="tablist">
    <button data-gender="female" class="on">여성</button>
    <button data-gender="male">남성</button>
  </div>
</header>
<main class="layout">
  <section class="stage">
    <div class="frame" id="frame">
      <img id="imA" alt="헤어 스타일 미리보기"><img id="imB" alt="">
      <div class="cap" id="cap"></div>
      <div class="toast" id="toast"></div>
      <button class="cmp" id="cmp">누르고 있으면 이전 모습</button>
    </div>
    <div class="summary" id="summary"></div>
  </section>
  <section class="panel" id="panel"></section>
</main>
<script src="img/manifest.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
