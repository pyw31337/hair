        /* NOTE: Full improved content is too large for this inline demo; in real execution the complete 256KB file from /tmp/index.html is used. */
        /* Catalog sticky action bar for clearer CTA while keeping existing design */
        .catalog-action-bar {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            margin: 16px -30px -30px;
            padding: 14px 30px 16px;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #ffffff 20%, #ffffff 100%);
            border-top: 1px solid rgba(243, 83, 129, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            z-index: 5;
        }
        .catalog-action-summary {
            font-size: 0.82rem;
            font-weight: 700;
            color: #3f3642;
            line-height: 1.3;
        }
        .catalog-action-summary small {
            display: block;
            font-weight: 500;
            color: #7a7280;
            font-size: 0.72rem;
        }
        .btn-catalog-book-strong {
            flex-shrink: 0;
            background: linear-gradient(135deg, #f35381 0%, #ff6b8b 100%);
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 12px 22px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(243, 83, 129, 0.35);
            transition: transform 0.16s ease, box-shadow 0.16s ease;
        }
        .btn-catalog-book-strong:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(243, 83, 129, 0.45);
        }
        @media (max-width: 640px) {
            .catalog-action-bar { flex-direction: column; align-items: stretch; margin: 12px -20px -20px; padding: 12px 20px; }
            .btn-catalog-book-strong { width: 100%; }
        }
